<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>점심 가계부</title>

<style>
:root{
  /* 감성적이고 알록달록한 컬러 팔레트 복구 */
  --bg:#F4F3F8;
  --surface:#FFFFFF;
  --surface2:#FAF9FD;
  --line:#EBE8F3;
  --text:#221F33;
  --sub:#6E6A86;
  --faint:#A5A1B8;

  --primary:#6C5CE7;
  --primary-soft:#EEECFD;
  --coral:#FF7675;
  --coral-soft:#FFF0F0;
  --mint:#00CEC9;
  --mint-soft:#E6FAF9;
  --yellow:#FDCB6E;
  --yellow-soft:#FFF8E7;
  --blue:#0984E3;
  --blue-soft:#E6F3FC;
  --purple:#A29BFE;
  --purple-soft:#F3F1FE;

  --radius-xl:24px;
  --radius-lg:18px;
  --radius-md:14px;
  --radius-sm:10px;

  --shadow:0 6px 20px rgba(108,92,231,0.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html {
  overflow-y: scroll;
}

html, body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Pretendard",
    "Apple SD Gothic Neo",
    "Malgun Gothic",
    sans-serif;
}

button, input, select{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:0 auto;
  background:var(--bg);
  padding-bottom:96px;
}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:20;
  padding:16px 20px 12px;
  background:rgba(244,243,248,.88);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.header-title{
  font-size:22px;
  font-weight:800;
  letter-spacing:-.5px;
  color:var(--primary);
}

.icon-btn{
  width:38px;
  height:38px;
  padding:0;
  border:0;
  border-radius:50%;
  background:#fff;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:var(--shadow);
}

.period-header{
  margin-top:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
}

.period-arrow{
  border:0;
  background:transparent;
  color:var(--sub);
  width:28px;
  height:28px;
  padding:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.period-label{
  min-width:160px;
  text-align:center;
  font-size:15px;
  font-weight:700;
  color:var(--text);
}

/* PAGE */
.page{
  display:none;
  padding:8px 20px 0;
}

.page.active{
  display:block;
}

/* DASHBOARD */
.hero{
  border-radius:var(--radius-xl);
  padding:24px 22px 21px;
  background:linear-gradient(135deg, #6C5CE7 0%, #8E7CFF 100%);
  color:#fff;
  margin-bottom:14px;
  box-shadow:0 8px 25px rgba(108,92,231,0.25);
}

.hero-label{
  font-size:13px;
  color:rgba(255,255,255,.8);
  font-weight:600;
}

.hero-amount{
  margin-top:6px;
  font-size:34px;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-1px;
}

.hero-progress{
  margin-top:20px;
  height:7px;
  border-radius:10px;
  overflow:hidden;
  background:rgba(255,255,255,.25);
}

.hero-progress-fill{
  width:0;
  height:100%;
  border-radius:10px;
  background:var(--yellow);
  transition:width .3s ease;
}

.hero-bottom{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

.hero-stat-label{
  color:rgba(255,255,255,.7);
  font-size:11px;
}

.hero-stat-value{
  margin-top:4px;
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* SUMMARY CARDS */
.summary-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:16px;
}

.summary-card{
  min-width:0;
  background:#fff;
  border-radius:var(--radius-lg);
  padding:16px;
  box-shadow:var(--shadow);
  border:1px solid rgba(235,232,243,0.6);
}

.summary-card.my-card{ border-left:4px solid var(--primary); }
.summary-card.friend-card{ border-left:4px solid var(--coral); }

.summary-label{
  font-size:12px;
  color:var(--sub);
  font-weight:600;
}

.summary-value{
  margin-top:6px;
  font-size:19px;
  font-weight:800;
  letter-spacing:-.4px;
}

.summary-sub{
  margin-top:4px;
  color:var(--faint);
  font-size:11px;
}

/* SECTION */
.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 2px 10px;
}

.section-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:-.3px;
  color:var(--text);
}

/* RECORDS LIST */
.entry-card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px;
  margin-bottom:9px;
  border-radius:var(--radius-md);
  background:#fff;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .1s ease;
}

.entry-card:active{
  transform:scale(0.98);
}

.entry-left{
  min-width:0;
}

.entry-place{
  font-size:15px;
  font-weight:750;
  color:var(--text);
}

.entry-menu{
  margin-top:3px;
  color:var(--sub);
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.entry-tags{
  display:flex;
  gap:5px;
  margin-top:6px;
}

.tag{
  padding:2px 7px;
  border-radius:6px;
  font-size:10px;
  font-weight:700;
}

.tag-payer-me{ background:var(--primary-soft); color:var(--primary); }
.tag-payer-treat{ background:var(--coral-soft); color:var(--coral); }
.tag-payer-friend{ background:var(--mint-soft); color:var(--mint); }

.tag-method{ background:var(--yellow-soft); color:#D68910; }

.entry-right{
  flex-shrink:0;
  text-align:right;
}

.entry-price{
  font-size:15px;
  font-weight:800;
  color:var(--text);
}

.entry-date{
  margin-top:4px;
  color:var(--faint);
  font-size:11px;
}

.empty{
  padding:48px 15px;
  text-align:center;
  color:var(--faint);
  font-size:13px;
  line-height:1.6;
}

/* CALENDAR */
.calendar{
  background:#fff;
  border-radius:var(--radius-lg);
  padding:16px 12px;
  box-shadow:var(--shadow);
}

.calendar-week{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  margin-bottom:10px;
}

.calendar-week span{
  text-align:center;
  color:var(--sub);
  font-size:11px;
  font-weight:700;
}

.calendar-week span:first-child{ color:var(--coral); }
.calendar-week span:last-child{ color:var(--blue); }

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.cal-cell{
  position:relative;
  height:52px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding-top:7px;
  background:var(--surface2);
  border:1px solid transparent;
  cursor:pointer;
  user-select:none;
}

.cal-cell.empty{
  background:transparent;
  cursor:default;
}

.cal-cell.today{
  border:2px solid var(--primary);
  background:#fff;
}

.cal-cell.has-entry{
  background:var(--primary-soft);
}

.cal-cell.excluded{
  background:#EAE8F0;
  opacity:0.5;
}

.cal-day{
  font-size:12px;
  font-weight:700;
  line-height:1;
}

.cal-amount{
  color:var(--primary);
  font-size:8px;
  font-weight:800;
  margin-top:4px;
}

.cal-cell.excluded .cal-amount{
  color:var(--sub);
  text-decoration:line-through;
}

/* STATS */
.stats-card{
  margin-bottom:14px;
  padding:20px;
  border-radius:var(--radius-lg);
  background:#fff;
  box-shadow:var(--shadow);
}

.stats-card-title{
  font-size:15px;
  font-weight:800;
  margin-bottom:14px;
  color:var(--text);
}

.compare-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.compare-box{
  padding:14px;
  border-radius:14px;
  background:var(--surface2);
}

.compare-label{
  color:var(--sub);
  font-size:11px;
  font-weight:600;
}

.compare-value{
  margin-top:5px;
  font-size:17px;
  font-weight:800;
}

.compare-sub{
  margin-top:3px;
  color:var(--faint);
  font-size:10px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  z-index:30;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:100%;
  max-width:430px;
  height:76px;
  padding:8px 18px 12px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
  background:rgba(255,255,255,.94);
  border-top:1px solid rgba(235,232,243,0.8);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
}

.nav-btn{
  border:0;
  background:transparent;
  color:var(--faint);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  font-weight:700;
}

.nav-btn.active{
  color:var(--primary);
}

.nav-icon{
  width:22px;
  height:22px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* FAB */
.fab{
  position:fixed;
  z-index:31;
  right:max(calc((100vw - 430px)/2 + 20px),20px);
  bottom:88px;
  width:54px;
  height:54px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg, #6C5CE7 0%, #8E7CFF 100%);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 22px rgba(108,92,231,0.4);
}

/* OVERLAY / SHEET */
.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
  background:rgba(34,31,51,.4);
}

.overlay.open{
  display:flex;
}

.sheet{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow:auto;
  padding:12px 22px 34px;
  background:#fff;
  border-radius:28px 28px 0 0;
  animation:sheetUp .22s ease;
}

@keyframes sheetUp{
  from{ transform:translateY(30px); opacity:.5; }
  to{ transform:translateY(0); opacity:1; }
}

.sheet-handle{
  width:36px;
  height:4px;
  border-radius:4px;
  background:#E0DDEB;
  margin:4px auto 18px;
}

.sheet-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.sheet-title{
  font-size:20px;
  font-weight:800;
  color:var(--text);
}

.close-btn{
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:#F2EFF9;
  color:var(--sub);
  display:flex;
  align-items:center;
  justify-content:center;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:var(--sub);
  font-size:12px;
  font-weight:700;
}

.field input, .field select{
  width:100%;
  height:48px;
  padding:0 14px;
  border:1px solid var(--line);
  border-radius:13px;
  background:var(--surface2);
  color:var(--text);
  outline:none;
  font-size:14px;
  font-weight:600;
}

.field input:focus, .field select:focus{
  border-color:var(--primary);
  background:#fff;
}

.two-fields{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.primary-btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg, #6C5CE7 0%, #8E7CFF 100%);
  color:#fff;
  font-size:15px;
  font-weight:800;
  box-shadow:0 6px 18px rgba(108,92,231,0.25);
  margin-top:10px;
}

.secondary-btn{
  width:100%;
  height:48px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  color:var(--text);
  font-size:14px;
  font-weight:700;
}

.danger-btn{
  color:var(--coral);
  background:var(--coral-soft);
  border-color:transparent;
}

#loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  color:var(--sub);
  font-size:14px;
  font-weight:700;
  z-index:999;
}
</style>
</head>

<body>

<div id="loading">불러오는 중...</div>

<div id="app" style="display:none;">

  <header>
    <div class="header-top">
      <div class="header-title">점심 가계부</div>

      <button class="icon-btn" id="openSettings" aria-label="설정">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1.51 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 8 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 3.7 15H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9A1.65 1.65 0 0 0 10 3.17V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 18.3 9c.16.6.7 1 1.31 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <div class="period-header">
      <button class="period-arrow" id="prevPeriod">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div class="period-label" id="periodHeaderLabel">-</div>
      <button class="period-arrow" id="nextPeriod">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
  </header>

  <!-- HOME PAGE -->
  <section class="page active" id="homePage">
    <div class="hero">
      <div class="hero-label">내 남은 예산</div>
      <div class="hero-amount" id="heroAmount">0원</div>
      <div class="hero-progress">
        <div class="hero-progress-fill" id="heroProgress"></div>
      </div>

      <div class="hero-bottom">
        <div class="hero-stat">
          <div class="hero-stat-label">내 설정 예산</div>
          <div class="hero-stat-value" id="heroBudget">0원</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-label">내가 쓴 총액</div>
          <div class="hero-stat-value" id="heroUsed">0원</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-label">친구 사준 돈</div>
          <div class="hero-stat-value" id="heroTreat">0원</div>
        </div>
      </div>
    </div>

    <div class="summary-grid">
      <div class="summary-card my-card">
        <div class="summary-label">내 총 지출 (사준 돈 포함)</div>
        <div class="summary-value" id="mySpentValue">0원</div>
        <div class="summary-sub">내 예산에서 차감됨</div>
      </div>

      <div class="summary-card friend-card">
        <div class="summary-label">친구 지출</div>
        <div class="summary-value" id="friendSpentValue">0원</div>
        <div class="summary-sub">친구 예산 기준</div>
      </div>
    </div>

    <div class="section-head">
      <div class="section-title">식비 내역</div>
    </div>

    <div id="homeRecords"></div>
  </section>

  <!-- CALENDAR PAGE -->
  <section class="page" id="calendarPage">
    <div class="section-head" style="margin-top:4px;">
      <div class="section-title">월간 캘린더</div>
    </div>

    <div class="calendar">
      <div class="calendar-week">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </section>

  <!-- STATS PAGE -->
  <section class="page" id="statsPage">
    <div class="stats-card" style="background: linear-gradient(135deg, #A29BFE 0%, #6C5CE7 100%); color:#fff;">
      <div class="stats-card-title" style="color:#fff;">이번 달 예산 및 지출 정산</div>
      <div class="compare-grid">
        <div class="compare-box" style="background:rgba(255,255,255,0.18); color:#fff;">
          <div class="compare-label" style="color:rgba(255,255,255,0.8);">내가 사준 총액</div>
          <div class="compare-value" id="statsTreatTotal">0원</div>
          <div class="compare-sub" style="color:rgba(255,255,255,0.7);">친구 밥 사준 금액</div>
        </div>
        <div class="compare-box" style="background:rgba(255,255,255,0.18); color:#fff;">
          <div class="compare-label" style="color:rgba(255,255,255,0.8);">내 순수 사용액</div>
          <div class="compare-value" id="statsPureMy">0원</div>
          <div class="compare-sub" style="color:rgba(255,255,255,0.7);">사준 금액 제외</div>
        </div>
      </div>
    </div>

    <div class="stats-card">
      <div class="stats-card-title">결제 수단별 지출</div>
      <div id="methodStats"></div>
    </div>
  </section>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-page="homePage">
      <span class="nav-icon">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path></svg>
      </span>
      홈
    </button>
    <button class="nav-btn" data-page="calendarPage">
      <span class="nav-icon">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="3"></rect><path d="M8 2v4M16 2v4M3 9h18"></path></svg>
      </span>
      캘린더
    </button>
    <button class="nav-btn" data-page="statsPage">
      <span class="nav-icon">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"></path><path d="M4 19h17"></path><rect x="7" y="12" width="3" height="5" rx="1"></rect><rect x="12" y="9" width="3" height="8" rx="1"></rect></svg>
      </span>
      통계
    </button>
  </nav>

  <!-- FAB -->
  <button class="fab" id="openAdd" aria-label="기록 추가">
    <svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>

  <!-- ADD / EDIT OVERLAY -->
  <div class="overlay" id="entryOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title" id="entrySheetTitle">식비 기록</div>
        <button class="close-btn" data-close="entryOverlay">✕</button>
      </div>

      <div class="field">
        <label>날짜</label>
        <input type="date" id="entryDate">
      </div>
      <div class="field">
        <label>장소</label>
        <input type="text" id="entryPlace" placeholder="예: 식당 이름">
      </div>
      <div class="field">
        <label>메뉴</label>
        <input type="text" id="entryMenu" placeholder="예: 돈까스">
      </div>
      <div class="two-fields">
        <div class="field">
          <label>금액</label>
          <input type="number" id="entryPrice" placeholder="0" inputmode="numeric">
        </div>
        <div class="field">
          <label>구분 (지출 주체)</label>
          <select id="entryPayer">
            <option value="me">내 지출 (내 예산)</option>
            <option value="treat">내가 쏨 (친구 사줌 - 내 예산)</option>
            <option value="friend">친구 지출 (친구 예산)</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>결제 수단</label>
        <select id="entryMethod">
          <option value="신한카드">신한카드</option>
          <option value="현대카드">현대카드</option>
          <option value="현금">현금</option>
          <option value="기타">기타 카드/페이</option>
        </select>
      </div>

      <button class="primary-btn" id="saveEntry">저장하기</button>
      <button class="secondary-btn danger-btn" id="deleteEntry" style="display:none;margin-top:8px;">삭제</button>
    </div>
  </div>

  <!-- SETTINGS OVERLAY -->
  <div class="overlay" id="settingsOverlay">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">설정</div>
        <button class="close-btn" data-close="settingsOverlay">✕</button>
      </div>

      <div class="field">
        <label>내 한달 예산 (사준 돈 포함 차감)</label>
        <input type="number" id="settingMyBudget" placeholder="300000">
      </div>
      <div class="field">
        <label>친구 한달 예산</label>
        <input type="number" id="settingFriendBudget" placeholder="300000">
      </div>

      <button class="primary-btn" id="saveSettings">설정 저장</button>
    </div>
  </div>

</div>

<script>
let state = {
  myBudget: 300000,
  friendBudget: 300000,
  entries: [],
  excludedDates: [],
  currentMonth: new Date(),
  editingId: null
};

function formatNum(n) {
  return (n || 0).toLocaleString('ko-KR');
}

function formatDateStr(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('entryDate').value = formatDateStr(new Date());

  render();
  setupEvents();
});

function setupEvents() {
  // Navigation
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.page).classList.add('active');
    });
  });

  // Settings
  document.getElementById('openSettings').addEventListener('click', () => {
    document.getElementById('settingMyBudget').value = state.myBudget;
    document.getElementById('settingFriendBudget').value = state.friendBudget;
    document.getElementById('settingsOverlay').classList.add('open');
  });

  document.getElementById('saveSettings').addEventListener('click', () => {
    state.myBudget = Number(document.getElementById('settingMyBudget').value) || 0;
    state.friendBudget = Number(document.getElementById('settingFriendBudget').value) || 0;
    document.getElementById('settingsOverlay').classList.remove('open');
    render();
  });

  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById(btn.getAttribute('data-close')).classList.remove('open');
    });
  });

  // Add Record Overlay
  document.getElementById('openAdd').addEventListener('click', () => {
    state.editingId = null;
    document.getElementById('entrySheetTitle').textContent = '식비 기록';
    document.getElementById('entryPlace').value = '';
    document.getElementById('entryMenu').value = '';
    document.getElementById('entryPrice').value = '';
    document.getElementById('entryPayer').value = 'me';
    document.getElementById('entryMethod').value = '신한카드';
    document.getElementById('deleteEntry').style.display = 'none';
    document.getElementById('entryOverlay').classList.add('open');
  });

  document.getElementById('saveEntry').addEventListener('click', () => {
    const date = document.getElementById('entryDate').value;
    const place = document.getElementById('entryPlace').value.trim();
    const menu = document.getElementById('entryMenu').value.trim();
    const price = Number(document.getElementById('entryPrice').value) || 0;
    const payer = document.getElementById('entryPayer').value;
    const method = document.getElementById('entryMethod').value;

    if(!date || !place || price <= 0) {
      alert('날짜, 장소, 금액을 정확히 입력해 주세요.');
      return;
    }

    if(state.editingId) {
      const idx = state.entries.findIndex(e => e.id === state.editingId);
      if(idx !== -1) {
        state.entries[idx] = { id: state.editingId, date, place, menu, price, payer, method };
      }
    } else {
      state.entries.push({ id: Date.now(), date, place, menu, price, payer, method });
    }

    document.getElementById('entryOverlay').classList.remove('open');
    render();
  });

  document.getElementById('deleteEntry').addEventListener('click', () => {
    if(state.editingId && confirm('해당 기록을 삭제하시겠습니까?')) {
      state.entries = state.entries.filter(e => e.id !== state.editingId);
      document.getElementById('entryOverlay').classList.remove('open');
      render();
    }
  });

  // Period Nav
  document.getElementById('prevPeriod').addEventListener('click', () => {
    state.currentMonth.setMonth(state.currentMonth.getMonth() - 1);
    render();
  });
  document.getElementById('nextPeriod').addEventListener('click', () => {
    state.currentMonth.setMonth(state.currentMonth.getMonth() + 1);
    render();
  });
}

function toggleExcludeDate(dateStr) {
  if (state.excludedDates.includes(dateStr)) {
    state.excludedDates = state.excludedDates.filter(d => d !== dateStr);
  } else {
    state.excludedDates.push(dateStr);
  }
  render();
}

function editEntry(id) {
  const item = state.entries.find(e => e.id === id);
  if(!item) return;

  state.editingId = id;
  document.getElementById('entrySheetTitle').textContent = '기록 수정';
  document.getElementById('entryDate').value = item.date;
  document.getElementById('entryPlace').value = item.place;
  document.getElementById('entryMenu').value = item.menu;
  document.getElementById('entryPrice').value = item.price;
  document.getElementById('entryPayer').value = item.payer;
  document.getElementById('entryMethod').value = item.method || '신한카드';
  document.getElementById('deleteEntry').style.display = 'block';
  document.getElementById('entryOverlay').classList.add('open');
}

function render() {
  const year = state.currentMonth.getFullYear();
  const month = state.currentMonth.getMonth();

  document.getElementById('periodHeaderLabel').textContent = `${year}년 ${month + 1}월`;

  const currentEntries = state.entries.filter(e => {
    const d = new Date(e.date);
    return d.getFullYear() === year && d.getMonth() === month;
  });

  // 예산 및 지출 계산 (사준 돈도 내 예산에서 빼기)
  let mySpent = 0;
  let treatSpent = 0;
  let friendSpent = 0;

  currentEntries.forEach(e => {
    if(e.payer === 'me') {
      mySpent += e.price;
    } else if(e.payer === 'treat') {
      mySpent += e.price;
      treatSpent += e.price;
    } else if(e.payer === 'friend') {
      friendSpent += e.price;
    }
  });

  const myRemaining = state.myBudget - mySpent;

  document.getElementById('heroBudget').textContent = formatNum(state.myBudget) + '원';
  document.getElementById('heroUsed').textContent = formatNum(mySpent) + '원';
  document.getElementById('heroTreat').textContent = formatNum(treatSpent) + '원';
  document.getElementById('heroAmount').textContent = formatNum(myRemaining) + '원';

  document.getElementById('mySpentValue').textContent = formatNum(mySpent) + '원';
  document.getElementById('friendSpentValue').textContent = formatNum(friendSpent) + '원';

  const pct = state.myBudget > 0 ? Math.min(100, Math.round((mySpent / state.myBudget) * 100)) : 0;
  document.getElementById('heroProgress').style.width = pct + '%';

  // Home Records List
  const homeRec = document.getElementById('homeRecords');
  if(currentEntries.length === 0) {
    homeRec.innerHTML = `<div class="empty">등록된 식비 내역이 없습니다.</div>`;
  } else {
    homeRec.innerHTML = currentEntries.map(e => {
      let payerLabel = '내 지출';
      let payerClass = 'tag-payer-me';
      if(e.payer === 'treat') { payerLabel = '내가 쏨(친구 사줌)'; payerClass = 'tag-payer-treat'; }
      if(e.payer === 'friend') { payerLabel = '친구 지출'; payerClass = 'tag-payer-friend'; }

      return `
        <div class="entry-card" onclick="editEntry(${e.id})">
          <div class="entry-left">
            <div class="entry-place">${e.place}</div>
            <div class="entry-menu">${e.menu || '-'}</div>
            <div class="entry-tags">
              <span class="tag ${payerClass}">${payerLabel}</span>
              <span class="tag tag-method">${e.method || '카드'}</span>
            </div>
          </div>
          <div class="entry-right">
            <div class="entry-price">${formatNum(e.price)}원</div>
            <div class="entry-date">${e.date.slice(5)}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Calendar Grid (1월 텍스트 표기 지움)
  const grid = document.getElementById('calendarGrid');
  grid.innerHTML = '';

  const firstDay = new Date(year, month, 1).getDay();
  const lastDate = new Date(year, month + 1, 0).getDate();
  const todayStr = formatDateStr(new Date());

  for(let i = 0; i < firstDay; i++) {
    const empty = document.createElement('div');
    empty.className = 'cal-cell empty';
    grid.appendChild(empty);
  }

  for(let date = 1; date <= lastDate; date++) {
    const cellDateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(date).padStart(2,'0')}`;
    const cell = document.createElement('div');
    
    let isExcluded = state.excludedDates.includes(cellDateStr);
    let isToday = cellDateStr === todayStr;

    const dayTotal = currentEntries
      .filter(e => e.date === cellDateStr)
      .reduce((acc, cur) => acc + cur.price, 0);

    let classes = ['cal-cell'];
    if(isToday) classes.push('today');
    if(isExcluded) classes.push('excluded');
    if(dayTotal > 0) classes.push('has-entry');

    cell.className = classes.join(' ');

    cell.innerHTML = `
      <span class="cal-day">${date}</span>
      <span class="cal-amount">${dayTotal > 0 ? formatNum(dayTotal) + '원' : ''}</span>
    `;

    cell.addEventListener('click', () => {
      const entryOfDay = currentEntries.find(e => e.date === cellDateStr);
      if(entryOfDay) {
        editEntry(entryOfDay.id);
      } else {
        toggleExcludeDate(cellDateStr);
      }
    });

    grid.appendChild(cell);
  }

  // Stats
  document.getElementById('statsTreatTotal').textContent = formatNum(treatSpent) + '원';
  document.getElementById('statsPureMy').textContent = formatNum(mySpent - treatSpent) + '원';

  // Method Stats Breakdown
  const methodMap = {};
  currentEntries.forEach(e => {
    const m = e.method || '기타';
    methodMap[m] = (methodMap[m] || 0) + e.price;
  });

  const methodContainer = document.getElementById('methodStats');
  const methodKeys = Object.keys(methodMap);
  if(methodKeys.length === 0) {
    methodContainer.innerHTML = `<div style="color:var(--faint);font-size:12px;text-align:center;padding:10px 0;">지출 내역이 없습니다.</div>`;
  } else {
    methodContainer.innerHTML = methodKeys.map(k => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);">
        <span style="font-size:13px;font-weight:700;">${k}</span>
        <span style="font-size:13px;font-weight:800;color:var(--primary);">${formatNum(methodMap[k])}원</span>
      </div>
    `).join('');
  }
}
</script>
</body>
</html>
